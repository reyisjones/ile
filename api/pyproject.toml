[project]
name = "ile-api"
version = "0.1.0"
description = "ILE — IKIGAI Learning Engine API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PERF"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (Depends)

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
